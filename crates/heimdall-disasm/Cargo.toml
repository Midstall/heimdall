[package]
name = "heimdall-disasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Disassembly of program artifacts for Heimdall (initial: llvm-objdump subprocess; future: in-process RISC-V decoder)."

[features]
default = []
# Enables `#[derive(ts_rs::TS)]` on wire types so the
# `gen_ts_bindings` test target can emit TypeScript interfaces into
# crates/heimdall-web/frontend/src/bindings/. Off by default so
# production builds don't pull in the ts-rs derive crate.
bindings = ["dep:ts-rs", "heimdall-core/bindings"]

[dependencies]
heimdall-core.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true }
tempfile.workspace = true
serde = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
